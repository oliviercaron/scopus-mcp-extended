[project]
name = "scopus-mcp-extended"
version = "0.2.0"
description = "A Model Context Protocol server for the Elsevier Scopus, ScienceDirect, PlumX and Embase APIs — 25 tools for academic literature search, retrieval and download."
readme = "README.md"
authors = [
  {name = "Olivier Caron", email = "caron.olivier.80@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=0.1.0",
    "python-dotenv>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/oliviercaron/scopus-mcp-extended"
Documentation = "https://github.com/oliviercaron/scopus-mcp-extended/blob/main/README.md"
Repository = "https://github.com/oliviercaron/scopus-mcp-extended"
Issues = "https://github.com/oliviercaron/scopus-mcp-extended/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1"
]

[project.scripts]
scopus-mcp = "scopus_mcp.server:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopus_mcp"]
